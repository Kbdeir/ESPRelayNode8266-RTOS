<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crash Diagnostics</title><style>:root{--page:#edf1f5;--ink:#152033;--muted:#687589;--line:#d9e1ea;--teal:#0f766e;--green:#15803d;--rose:#be123c;--slate:#475569}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#dfe9f3,#edf1f5 320px);font:14px Arial;color:var(--ink)}main{width:min(1080px,calc(100vw - 32px));margin:auto;padding:24px}.top{color:#fff;background:linear-gradient(135deg,#152033,#103f49,#0f766e);padding:24px;border-radius:8px}.grid{display:grid;grid-template-columns:1fr 300px;gap:16px;margin-top:16px}.card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:18px;margin-bottom:16px}.card h2{margin-top:0;border-bottom:1px solid var(--line);padding-bottom:10px}.form{display:grid;grid-template-columns:1fr 1fr;gap:14px}.f{display:flex;flex-direction:column;gap:6px}.full{grid-column:1/-1}input,select{padding:9px;border:1px solid #bac7d5;border-radius:8px}.check{display:flex;gap:8px;align-items:center}.btn,a.btn,button{display:inline-block;background:var(--teal);color:white;padding:10px 14px;border:0;border-radius:8px;text-decoration:none;margin:5px;cursor:pointer}.danger{background:var(--rose)}.secondary{background:var(--slate)}.ok{color:var(--green)}.bad{color:var(--rose)}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid var(--line);text-align:left}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-top:16px}.metric{background:#fff;border:1px solid var(--line);border-radius:8px;padding:16px}.k{color:var(--muted);font-size:11px;text-transform:uppercase}.v{font-size:18px;font-weight:bold;margin-top:5px}@media(max-width:800px){.grid,.form{grid-template-columns:1fr}}</style></head><body><main><header class="top"><h1>Crash / Reset Diagnostics</h1><div><a class="btn" href="/config.html">Config</a><a class="btn" href="/LiveReadings.html">Live</a><a class="btn" href="/RelayConfig.html">Relays</a><a class="btn" href="/Timer1.html">Timers</a><a class="btn" href="/Files.html">Files</a><a class="btn" href="/Backup.html">Backup</a><a class="btn" href="/coredump.html">Crash</a><a class="btn" href="/FirmwareMaintenance.html">OTA</a></div></header><section class="card"><p>ESP8266 RTOS stores the last abnormal reset class persistently. This UI does not fabricate an ESP32-style coredump/backtrace.</p><pre id="s">Loading…</pre><button class="danger" onclick="erase()">Clear stored crash status</button></section></main><script>async function load(){let d=await fetch('/CoreDumpStatus.json').then(r=>r.json());s.textContent=JSON.stringify(d,null,2)}async function erase(){await fetch('/EraseCoreDump.json',{method:'POST'});load()}load();</script></body></html>
