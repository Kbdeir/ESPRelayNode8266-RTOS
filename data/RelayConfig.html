<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Relay Configuration</title><style>:root{--page:#edf1f5;--ink:#152033;--muted:#687589;--line:#d9e1ea;--teal:#0f766e;--green:#15803d;--rose:#be123c;--slate:#475569}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#dfe9f3,#edf1f5 320px);font:14px Arial;color:var(--ink)}main{width:min(1080px,calc(100vw - 32px));margin:auto;padding:24px}.top{color:#fff;background:linear-gradient(135deg,#152033,#103f49,#0f766e);padding:24px;border-radius:8px}.grid{display:grid;grid-template-columns:1fr 300px;gap:16px;margin-top:16px}.card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:18px;margin-bottom:16px}.card h2{margin-top:0;border-bottom:1px solid var(--line);padding-bottom:10px}.form{display:grid;grid-template-columns:1fr 1fr;gap:14px}.f{display:flex;flex-direction:column;gap:6px}.full{grid-column:1/-1}input,select{padding:9px;border:1px solid #bac7d5;border-radius:8px}.check{display:flex;gap:8px;align-items:center}.btn,a.btn,button{display:inline-block;background:var(--teal);color:white;padding:10px 14px;border:0;border-radius:8px;text-decoration:none;margin:5px;cursor:pointer}.danger{background:var(--rose)}.secondary{background:var(--slate)}.ok{color:var(--green)}.bad{color:var(--rose)}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid var(--line);text-align:left}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-top:16px}.metric{background:#fff;border:1px solid var(--line);border-radius:8px;padding:16px}.k{color:var(--muted);font-size:11px;text-transform:uppercase}.v{font-size:18px;font-weight:bold;margin-top:5px}@media(max-width:800px){.grid,.form{grid-template-columns:1fr}}</style></head><body><main><header class="top"><h1>Relay Configuration</h1><div><a class="btn" href="/config.html">Config</a><a class="btn" href="/LiveReadings.html">Live</a><a class="btn" href="/RelayConfig.html">Relays</a><a class="btn" href="/Timer1.html">Timers</a><a class="btn" href="/Files.html">Files</a><a class="btn" href="/Backup.html">Backup</a><a class="btn" href="/coredump.html">Crash</a><a class="btn" href="/FirmwareMaintenance.html">OTA</a></div></header><section class="card"><h2>Relay Control</h2><select id="rn"><option value="0">Relay 0</option><option value="1">Relay 1</option></select><button onclick="setr('on')">ON</button><button class="danger" onclick="setr('off')">OFF</button><button class="secondary" onclick="setr('toggle')">Toggle</button></section><form method="get" action="/ApplyRelay.html"><section class="card"><h2>Relay settings</h2><input type="hidden" name="RELAYNB" id="RelayNB"><div class="form"><div class="f full"><label>Coil publish topic</label><input id="PUB_TOPIC1" name="PUB_TOPIC1"></div><div class="f full"><label>State publish topic</label><input id="STATE_PUB_TOPIC" name="STATE_PUB_TOPIC"></div><div class="f full"><label>Subscribe topic</label><input id="SUB_TOPIC1" name="SUB_TOPIC1"></div><div class="f full"><label>Last Will topic</label><input id="LWILL_TOPIC" name="LWILL_TOPIC"></div><div class="f full"><label>ACS current publish topic</label><input id="ACS_AMPS" name="ACS_AMPS"></div><div class="f"><label>TTL seconds</label><input id="ttl" name="ttl" type="number" min="0" step="1"></div><div class="f"><label>TTA seconds</label><input id="tta" name="tta" type="number" min="0" step="1"></div><label class="check"><input id="ACS_Active" name="ACS_Active" value="1" type="checkbox"> Enable ACS712</label><div class="f"><label>ACS model amps</label><select id="ACS_Sensor_Model" name="ACS_Sensor_Model"><option>5</option><option>20</option><option>30</option></select></div><div class="f"><label>Max current</label><input id="Max_Current" name="Max_Current" type="number" step="0.1"></div></div><button type="submit">Save Relay</button></section></form></main><script>async function load(){RelayNB.value=rn.value;let d=await fetch('/GetConfig.json?relay='+rn.value).then(r=>r.json());['PUB_TOPIC1','STATE_PUB_TOPIC','SUB_TOPIC1','LWILL_TOPIC','ACS_AMPS','ttl','tta','ACS_Sensor_Model','Max_Current'].forEach(k=>document.getElementById(k).value=(d[k]==null?'':d[k]));ACS_Active.checked=!!d.ACS_Active}async function setr(action){await fetch('/RelayControl.json?relay='+rn.value+'&action='+action)}rn.onchange=load;load();</script></body></html>
