<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Automation Rules</title>
<style>
:root{--page:#edf1f5;--ink:#152033;--muted:#687589;--panel:#fff;--line:#d9e1ea;--field:#fdfefe;--teal:#0f766e;--blue:#2563eb;--green:#15803d;--amber:#b7791f;--rose:#be123c;--slate:#475569}*{box-sizing:border-box}html{background:var(--page)}body{margin:0;color:var(--ink);font:14px/1.42 Arial,Helvetica,sans-serif;background:linear-gradient(180deg,#dfe9f3,#edf1f5 320px);min-height:100vh}.shell{width:min(940px,calc(100vw - 32px));margin:auto;padding:24px 0 36px}.top{color:#fff;background:linear-gradient(135deg,#152033,#103f49,#0f766e);padding:24px 26px;border-radius:8px;display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center}.top h1{margin:0;font-size:28px}.top p{margin:7px 0 0;color:#cfe0ea}.back{color:#fff;text-decoration:none;border:1px solid rgba(255,255,255,.35);border-radius:8px;padding:9px 13px;font-weight:bold}.tabs{display:flex;gap:8px;margin:16px 0}.tab{background:var(--slate);box-shadow:none}.tab.active{background:var(--teal)}.panel{display:none}.panel.active{display:block}.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:18px;margin-top:16px}.card h2{display:flex;align-items:center;gap:10px;margin:-2px 0 16px;padding-bottom:12px;border-bottom:1px solid var(--line);font-size:18px}.card h2:before{content:"";width:10px;height:28px;border-radius:6px;background:var(--teal)}.selector{border-color:#86efac}.selector h2:before{background:var(--green)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 16px}.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}.field{display:flex;flex-direction:column;gap:6px}.full{grid-column:1/-1}label{font-size:12px;font-weight:bold;color:var(--muted)}input,select{min-height:38px;border:1px solid #bac7d5;border-radius:8px;background:var(--field);color:var(--ink);padding:8px 10px;font:inherit}input:focus,select:focus{outline:0;border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.16)}input[type=checkbox]{width:18px;height:18px;accent-color:var(--teal)}.check{min-height:38px;display:flex;align-items:center;gap:9px;background:#f8fafc;border:1px solid var(--line);border-radius:8px;padding:8px 10px}.sub{margin:20px 0 10px;padding:7px 10px;background:#f8fafc;border:1px solid var(--line);border-radius:8px;font-size:12px;font-weight:bold;text-transform:uppercase}.hint{color:var(--muted);font-size:12px}.status{display:flex;flex-wrap:wrap;gap:8px}.badge{border-radius:999px;padding:5px 9px;background:#eef2f6;color:var(--slate);font-size:12px;font-weight:bold}.badge.ok{background:#dcfce7;color:var(--green)}.badge.warn{background:#fef3c7;color:#92400e}.badge.bad{background:#ffe4e6;color:var(--rose)}.actions{display:flex;gap:10px;align-items:center;margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}button{min-height:38px;border:0;border-radius:8px;background:var(--teal);color:#fff;padding:8px 15px;font:inherit;font-weight:bold;cursor:pointer}.secondary{background:var(--slate)}.message{font-weight:bold}.message.ok{color:var(--green)}.message.bad{color:var(--rose)}.remote-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.remote{margin-top:0}.remote h2:before{background:var(--blue)}.remote .grid{grid-template-columns:1fr}.remote-state{min-height:26px}.hidden{display:none!important}@media(max-width:720px){.top,.grid,.grid.three,.remote-grid{grid-template-columns:1fr}.back{justify-self:start}}
</style><style>
.mqtt-fields,.modbus-fields{grid-column:1/-1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.remote-state{grid-column:1/-1}
@media(max-width:720px){.mqtt-fields,.modbus-fields{grid-template-columns:1fr}}
</style></head><body><main class="shell">
<header class="top"><div><h1>Automation Rules</h1><p>Local, MQTT and Modbus conditions with local or remote coil actions.</p></div><a class="back" href="/config.html">Back to Config</a></header>
<nav class="tabs"><button class="tab active" data-panel="rules">Rules</button><button class="tab" data-panel="remotes">Remote Sensors</button><button class="secondary" type="button" onclick="load(false)">Refresh Status</button></nav>
<section id="rules" class="panel active">
 <div class="card selector"><h2>Select Rule</h2><div class="grid"><div class="field"><label for="ruleSlot">Rule slot</label><select id="ruleSlot"><option value="0">Rule 1</option><option value="1">Rule 2</option><option value="2">Rule 3</option><option value="3">Rule 4</option></select></div><div class="field"><label>Status</label><div id="ruleStatus" class="status"></div></div></div></div>
 <form id="ruleForm">
  <div class="card"><h2 id="ruleTitle">Rule 1</h2><div class="grid"><div class="field"><label>Enabled</label><label class="check"><input type="checkbox" id="enabled"> Enable this rule</label></div><div class="field"><label for="output">Output</label><select id="output"><option value="0">Local relay</option><option value="1">Modbus TCP coil</option></select></div><div class="field local-output"><label for="target">Target relay</label><select id="target"></select></div><div class="field"><label for="action">Action when matched</label><select id="action"><option value="0">On</option><option value="1">Off</option><option value="2">Toggle</option></select></div><div class="field"><label for="trigger">Trigger mode</label><select id="trigger"><option value="0">On change</option><option value="1">Periodic</option></select></div><div class="field remote-output"><label for="mbHost">Destination IPv4</label><input id="mbHost" maxlength="15" placeholder="192.168.1.50"></div><div class="field remote-output"><label for="mbPort">TCP port</label><input id="mbPort" type="number" min="1" max="65535" value="502"></div><div class="field remote-output"><label for="mbUnit">Unit ID</label><input id="mbUnit" type="number" min="1" max="247" value="1"></div><div class="field remote-output"><label for="mbAddress">Zero-based coil address</label><input id="mbAddress" type="number" min="0" max="65535" value="0"></div><div class="field remote-output"><label>When condition clears</label><label class="check"><input id="mbClear" type="checkbox" checked> Send opposite state</label></div></div></div>
  <div class="card"><h2>Conditions</h2><div class="sub">Condition 1</div><div class="grid three"><div class="field"><label for="c0source">Source</label><select id="c0source" class="source"></select></div><div class="field"><label for="c0op">Comparison</label><select id="c0op" class="operator"><option value="0">Greater than</option><option value="1">Less than</option><option value="2">Between</option><option value="3">Equal</option></select></div><div class="field"><label for="c0v1">Value</label><input id="c0v1" type="text" placeholder="number, on or off"></div><div id="c0upper" class="field hidden"><label for="c0v2">Upper value</label><input id="c0v2" type="text" placeholder="number, on or off"></div></div>
   <div class="sub">Combine with</div><div class="grid"><div class="field"><label for="logic">Logic</label><select id="logic"><option value="0">AND</option><option value="1">OR</option></select></div></div>
   <div class="sub">Condition 2 (optional)</div><div class="grid three"><div class="field"><label for="c1source">Source</label><select id="c1source" class="source optional"></select></div><div class="field"><label for="c1op">Comparison</label><select id="c1op" class="operator"><option value="0">Greater than</option><option value="1">Less than</option><option value="2">Between</option><option value="3">Equal</option></select></div><div class="field"><label for="c1v1">Value</label><input id="c1v1" type="text" placeholder="number, on or off"></div><div id="c1upper" class="field hidden"><label for="c1v2">Upper value</label><input id="c1v2" type="text" placeholder="number, on or off"></div></div>
  </div>
  <div class="card"><h2>Timing and Gating</h2><div class="grid three"><div class="field"><label for="gate">Active only during timer</label><select id="gate"><option value="0">Always</option><option value="1">Timer 1</option><option value="2">Timer 2</option><option value="3">Timer 3</option><option value="4">Timer 4</option></select></div><div class="field"><label for="hold">Hold time (seconds)</label><input id="hold" type="number" min="0" max="65535"></div><div class="field"><label for="cooldown">Cooldown (seconds)</label><input id="cooldown" type="number" min="0" max="65535"></div></div><div class="actions"><button type="submit">Save Rule</button><span id="ruleMessage" class="message"></span></div></div>
 </form>
</section>
<section id="remotes" class="panel"><div class="remote-grid" id="remoteGrid"></div></section>
</main><script>
var state={relayCount:0,staleSeconds:300,rules:[],remotes:[]},selected=0;
function el(id){return document.getElementById(id)}
function esc(s){return String(s||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function post(url,data){return fetch(url,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams(data)}).then(async function(r){var j=await r.json();if(!r.ok||!j.ok)throw new Error(j.message||'Request failed');return j})}
function sources(optional){var a=optional?[[0,'(none)']]:[];a=a.concat([[1,'Temperature 1'],[2,'Temperature 2'],[3,'ACS current'],[4,'Input 1'],[5,'Input 2'],[6,'Input 3']]);for(var i=0;i<state.relayCount;i++)a.push([7+i,'Relay '+(i+1)]);state.remotes.forEach(function(r,i){a.push([20+i,r.label||('Remote '+(i+1))])});return a}
function fillSources(){document.querySelectorAll('select.source').forEach(function(s){var old=s.value,a=sources(s.classList.contains('optional'));s.innerHTML=a.map(function(x){return '<option value="'+x[0]+'">'+esc(x[1])+'</option>'}).join('');if(a.some(function(x){return String(x[0])===old}))s.value=old})}
function setOptions(){var h='';for(var i=0;i<state.relayCount;i++)h+='<option value="'+i+'">Relay '+(i+1)+'</option>';el('target').innerHTML=h;fillSources()}
function value(id,v){el(id).value=v==null?'':v}
function renderRule(){var r=state.rules[selected];if(!r)return;el('ruleTitle').textContent='Rule '+(selected+1);el('enabled').checked=!!r.enabled;['target','action','logic','trigger','gate','hold','cooldown'].forEach(function(k){value(k,r[k])});value('output',r.output||0);value('mbHost',r.mbHost||'');value('mbPort',r.mbPort||502);value('mbUnit',r.mbUnit||1);value('mbAddress',r.mbAddress||0);el('mbClear').checked=r.mbClear!==0;for(var i=0;i<2;i++){var c=r.conditions[i];value('c'+i+'source',c.source);value('c'+i+'op',c.op);value('c'+i+'v1',c.value1);value('c'+i+'v2',c.value2)}updateOperators();renderStatus(r.status)}
function badge(text,kind){return '<span class="badge '+kind+'">'+esc(text)+'</span>'}
function renderStatus(s){var h='';if(!s){el('ruleStatus').innerHTML='';return}h+=badge(s.available?'Sources ready':'Source unavailable',s.available?'ok':'bad');h+=badge(s.gateOpen?'Gate open':'Gate closed',s.gateOpen?'ok':'warn');h+=badge(s.matched?'Matched':'Not matched',s.matched?'ok':'');if(s.secondsSinceFire)h+=badge('Last fired '+s.secondsSinceFire+'s ago','');el('ruleStatus').innerHTML=h}
function updateOperators(){for(var i=0;i<2;i++)el('c'+i+'upper').classList.toggle('hidden',el('c'+i+'op').value!=='2');var remote=el('output').value==='1',periodic=el('trigger').value==='1';document.querySelectorAll('.remote-output').forEach(function(x){x.classList.toggle('hidden',!remote)});document.querySelectorAll('.local-output').forEach(function(x){x.classList.toggle('hidden',remote)});el('action').options[2].disabled=periodic||remote;if((periodic||remote)&&el('action').value==='2')el('action').value='0'}
function showMessage(id,text,ok){var e=el(id);e.textContent=text;e.className='message '+(ok?'ok':'bad')}
function remoteLive(r){var configured=r.transport===1?r.host:r.topic;return r.valid?badge('Value '+r.value+' | '+r.age+'s old','ok'):badge(configured?'Waiting / stale':'Not configured',configured?'warn':'')}
function opts(list,v){return list.map(function(x){return '<option value="'+x[0]+'"'+(Number(v)===x[0]?' selected':'')+'>'+x[1]+'</option>'}).join('')}
function renderRemotes(){el('remoteGrid').innerHTML=state.remotes.map(function(r,i){return '<form class="card remote" data-id="'+(i+1)+'"><h2>Remote Sensor '+(i+1)+'</h2><div class="grid">'+
  '<div class="field"><label>Label</label><input name="label" maxlength="31" value="'+esc(r.label)+'"></div>'+
  '<div class="field"><label>Protocol</label><select name="transport">'+opts([[0,'MQTT'],[1,'Modbus TCP']],r.transport)+'</select></div>'+
  '<div class="mqtt-fields"><div class="field"><label>MQTT topic</label><input name="topic" maxlength="63" value="'+esc(r.topic)+'" placeholder="site/device/value"></div><div class="field"><label>JSON key (optional)</label><input name="jsonKey" maxlength="31" value="'+esc(r.jsonKey)+'" placeholder="temperature"></div></div>'+
  '<div class="modbus-fields"><div class="field"><label>Device IPv4</label><input name="host" maxlength="15" value="'+esc(r.host)+'" placeholder="192.168.1.50"></div><div class="field"><label>Port</label><input name="port" type="number" min="1" max="65535" value="'+(r.port||502)+'"></div><div class="field"><label>Unit ID</label><input name="unit" type="number" min="1" max="247" value="'+(r.unit||1)+'"></div><div class="field"><label>Register type</label><select name="function">'+opts([[1,'Coil (01)'],[2,'Discrete input (02)'],[3,'Holding register (03)'],[4,'Input register (04)']],r.function||3)+'</select></div><div class="field"><label>Zero-based address</label><input name="address" type="number" min="0" max="65535" value="'+(r.address||0)+'"></div><div class="field"><label>Value type</label><select name="valueType">'+opts([[0,'Boolean'],[1,'UInt16'],[2,'Int16'],[3,'UInt32'],[4,'Int32'],[5,'Float32']],r.valueType==null?1:r.valueType)+'</select></div><div class="field word-order"><label>32-bit byte order</label><select name="wordOrder">'+opts([[0,'ABCD'],[1,'CDAB'],[2,'BADC'],[3,'DCBA']],r.wordOrder||0)+'</select></div><div class="field"><label>Poll interval (seconds)</label><input name="poll" type="number" min="5" max="300" value="'+(r.poll||10)+'"></div><div class="field"><label>Scale</label><input name="scale" type="number" step="any" value="'+(r.scale==null?1:r.scale)+'"></div><div class="field"><label>Offset</label><input name="offset" type="number" step="any" value="'+(r.offset||0)+'"></div></div>'+
  '<div id="remoteState'+i+'" class="remote-state status">'+remoteLive(r)+'</div></div><div class="actions"><button type="submit">Save Sensor</button><span class="message"></span></div></form>'}).join('');document.querySelectorAll('form.remote').forEach(function(f){f.onsubmit=saveRemote;f.elements.transport.onchange=function(){updateRemoteForm(f)};f.elements['function'].onchange=function(){updateRemoteForm(f)};updateRemoteForm(f)})}
function updateRemoteForm(f){var mb=f.elements.transport.value==='1',fn=Number(f.elements['function'].value),type=f.elements.valueType;f.querySelector('.mqtt-fields').classList.toggle('hidden',mb);f.querySelector('.modbus-fields').classList.toggle('hidden',!mb);for(var i=0;i<type.options.length;i++)type.options[i].disabled=fn<=2?i!==0:i===0;if(type.options[type.selectedIndex].disabled)type.value=fn<=2?'0':'1';f.querySelector('.word-order').classList.toggle('hidden',Number(type.value)<3);type.onchange=function(){f.querySelector('.word-order').classList.toggle('hidden',Number(type.value)<3)}}
function renderRemoteStates(){state.remotes.forEach(function(r,i){var e=el('remoteState'+i);if(e)e.innerHTML=remoteLive(r)})}
function load(all){return fetch('/api/automation',{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('Could not load automation');return r.json()}).then(function(d){state=d;if(all){setOptions();renderRule();renderRemotes()}else{renderStatus(state.rules[selected].status);renderRemoteStates()}}).catch(function(e){showMessage('ruleMessage',e.message,false)})}
function saveRule(ev){ev.preventDefault();var d={id:selected+1,enabled:el('enabled').checked?1:0,output:el('output').value,mbHost:el('mbHost').value,mbPort:el('mbPort').value,mbUnit:el('mbUnit').value,mbAddress:el('mbAddress').value,mbClear:el('mbClear').checked?1:0};['target','action','logic','trigger','gate','hold','cooldown'].forEach(function(k){d[k]=el(k).value});for(var i=0;i<2;i++){d['c'+i+'source']=el('c'+i+'source').value;d['c'+i+'op']=el('c'+i+'op').value;d['c'+i+'value1']=el('c'+i+'v1').value||0;d['c'+i+'value2']=el('c'+i+'v2').value||0}post('/api/automation/rule',d).then(function(j){showMessage('ruleMessage',j.message,true);return load(true)}).catch(function(e){showMessage('ruleMessage',e.message,false)})}
function saveRemote(ev){ev.preventDefault();var f=ev.currentTarget,msg=f.querySelector('.message'),d={id:f.dataset.id,label:f.elements.label.value,transport:f.elements.transport.value};if(d.transport==='1'){['host','port','unit','function','address','valueType','wordOrder','poll','scale','offset'].forEach(function(k){d[k]=f.elements[k].value})}else{d.topic=f.elements.topic.value;d.jsonKey=f.elements.jsonKey.value}post('/api/automation/remote',d).then(function(j){msg.textContent=j.message;msg.className='message ok';return load(true)}).catch(function(e){msg.textContent=e.message;msg.className='message bad'})}
document.querySelectorAll('.tab').forEach(function(b){b.onclick=function(){document.querySelectorAll('.tab,.panel').forEach(function(x){x.classList.remove('active')});b.classList.add('active');el(b.dataset.panel).classList.add('active')}});el('ruleSlot').onchange=function(){selected=Number(this.value);renderRule()};document.querySelectorAll('.operator').forEach(function(x){x.onchange=updateOperators});el('trigger').onchange=updateOperators;el('output').onchange=updateOperators;el('ruleForm').onsubmit=saveRule;load(true);
</script></body></html>
