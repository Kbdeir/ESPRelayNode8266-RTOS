[platformio]
default_envs = huzzah_rtos
src_dir = main
data_dir = data

[env:huzzah_rtos]
; ESP8266_RTOS_SDK 3.4 support for PlatformIO is provided by the freedib
; platform fork. Both the platform and framework package are pinned so the
; toolchain/framework do not drift between builds.
platform = https://github.com/freedib/platform-espressif8266.git#c5bdf28d6fa713740c5d42a6d9d08b8e9fe9bc3b
framework = esp8266-rtos-sdk
board = huzzah
; ESP8266 maps one 1 MB flash window during startup; each OTA image must fit
; between its 0x10000 slot offset and the end of that window. Leave 1 KiB
; for image headers/padding not included in PlatformIO's ELF size report.
board_upload.maximum_size = 982016

platform_packages =
    framework-esp8266-rtos-sdk @ https://github.com/freedib/framework-esp8266-rtos-sdk.git#a3b399f122a8f15554cc4eb2577014b7838b5786
    tool-genbin-esp8266 @ https://github.com/freedib/tool-genbin-esp8266.git#v1.0.0

; The PlatformIO registry has no Windows package for the SDK's GCC 8.4
; requirement. Run tools/bootstrap_toolchain.ps1 once before the first build.

board_build.partitions = partitions.csv
board_build.filesystem = littlefs
board_build.f_cpu = 80000000L
; The ROM boot preamble is fixed at 74880, but the application console uses
; the standard 115200 baud rate for reliable USB-UART adapter support.
monitor_speed = 115200
upload_speed = 921600
upload_protocol = esptool

; Fetch the two pinned application components that are not part of the SDK.
extra_scripts = pre:tools/pio_prepare.py

; Keep PlatformIO dependency scanning out of the IDF component graph. CMake is
; authoritative for component dependencies in this project.
lib_ldf_mode = off

; Useful during soak testing. Do not add debug logging globally here because it
; materially changes ESP8266 heap/timing behaviour.
build_type = release
